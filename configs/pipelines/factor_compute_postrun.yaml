name: factor_compute_postrun
workspace: ../../quant-workspace/configs/default.workspace.yaml

steps:
  - name: data_kit_catalog
    cwd: "{QW_QUANT_DATA_KIT_REPO}"
    cmd: qdk-catalog list

  - name: factors_compute
    cwd: "{QW_QUANT_FACTORS_REPO}"
    cmd: quant-factors list

  - name: lab_register
    cwd: "{QW_QUANT_LAB_REPO}"
    cmd: quant-lab scan --config ../../quant-workspace/configs/default.workspace.yaml
