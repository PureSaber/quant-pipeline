name: e2e_smoke
workspace: ../../quant-workspace/configs/default.workspace.yaml

steps:
  - name: regime_detect
    cwd: "{QW_QUANT_REGIME_REPO}"
    cmd: quant-regime detect --config configs/default.yaml --out state/regime.json

  - name: paper_step
    cwd: "{QW_QUANT_PAPER_SIM_REPO}"
    cmd: quant-paper step --config configs/pipeline.yaml

  - name: risk_check
    cwd: "{QW_QUANT_RISK_MONITOR_REPO}"
    cmd: quant-risk check --config configs/paper_smoke.yaml --out state/alerts.json
