name: research_integrity_postrun
workspace: ../../quant-workspace/configs/default.workspace.yaml
run_id: ${QUANT_RUN_ID}

steps:
  - name: validate_standard_contract
    cwd: "{QW_QUANT_LAB_REPO}"
    cmd: quant-lab validate --run-dir "{QW_A_SHARE_MULTIFACTOR_OUTPUTS}/{QUANT_PIPELINE_RUN_ID}"

  - name: performance_attribution
    cwd: "{QW_QUANT_REPORT_HUB_REPO}"
    cmd: quant-report attribute --run-dir "{QW_A_SHARE_MULTIFACTOR_OUTPUTS}/{QUANT_PIPELINE_RUN_ID}" --asset-returns "${QUANT_ASSET_RETURNS}"

  - name: index_experiment
    cwd: "{QW_QUANT_LAB_REPO}"
    cmd: quant-lab scan --root "{QW_A_SHARE_MULTIFACTOR_OUTPUTS}" --project a-share-multifactor
