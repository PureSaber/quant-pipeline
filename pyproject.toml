[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-pipeline"
version = "0.4.0"
description = "Typed, deterministic local DAG orchestration for the PureSaber quant stack"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "quant-lab @ git+https://github.com/PureSaber/quant-lab.git@8f47d2ba69ee532d7559957e4b2fb36c2b13a3d8",
    "quant-factors @ git+https://github.com/PureSaber/quant-factors.git@e5da58606081d9f733cdb0fec96ca408003b4e41",
    "quant-workspace @ git+https://github.com/PureSaber/quant-workspace.git@v0.3.1",
]

[project.optional-dependencies]
workspace = []
research = [
    "quant-agent @ git+https://github.com/PureSaber/quant-agent.git@c8a87c3617ab85152468759b6a673dad3c6297bc",
    "a-share-multifactor @ git+https://github.com/PureSaber/a-share-multifactor.git@48bdf2bbc04c2b771f5d5938323196cab4e861f1",
    "quant-report-hub @ git+https://github.com/PureSaber/quant-report-hub.git@ab1300c996f8b39f24a6002128bcc194b12d65da",
]
dev = [
    "pytest>=9.0,<10",
    "pytest-cov>=7.0,<8",
    "ruff>=0.16,<0.17",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
quant-pipe = "quant_pipeline.cli:main"
quant-research = "quant_pipeline.research_workbench:main"
quant-research-web = "quant_pipeline.research_web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quant_pipeline = ["research_console.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.coverage.run]
branch = true
source = ["quant_pipeline"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false

[tool.quant-workspace]
layer = "orchestration"
schemas = [
    { id = "puresaber.pipeline", version = "2.0.0" },
]
lock-files = ["requirements.lock"]
