[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-pipeline"
version = "0.4.0"
description = "Typed, deterministic local DAG orchestration for the PureSaber quant stack"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "quant-lab @ git+https://github.com/PureSaber/quant-lab.git@4c48f8a678c8d29a7dc46294c99f0e668cd6c52b",
    "quant-factors @ git+https://github.com/PureSaber/quant-factors.git@1c798bc737bc92fa5eca85dd0663dc608104f721",
    "quant-workspace @ git+https://github.com/PureSaber/quant-workspace.git@e0ac104ecad9e6d51fa95f0f469b191bf58e8403",
]

[project.optional-dependencies]
workspace = []
research = [
    "arch>=7.2,<9",
    "quant-agent @ git+https://github.com/PureSaber/quant-agent.git@6085431dd041a555b8c116c2323f5e59566f7dd7",
    "a-share-multifactor @ git+https://github.com/PureSaber/a-share-multifactor.git@711559be4d66f4d1c9387a004587b0848ca004c6",
    "quant-report-hub @ git+https://github.com/PureSaber/quant-report-hub.git@dcc52c675623d4fd9f331914990b1899b744fca9",
]
dev = [
    "arch>=7.2,<9",
    "setuptools>=68",
    "wheel>=0.46",
    "pytest>=9.0,<10",
    "pytest-cov>=7.0,<8",
    "ruff>=0.16,<0.17",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
quant-pipe = "quant_pipeline.cli:main"
quant-research = "quant_pipeline.research_workbench:main"
quant-research-web = "quant_pipeline.research_web:main"
quant-family-evidence = "quant_pipeline.family_evidence:main"
quant-forward = "quant_pipeline.forward_daily:main"
quant-isolate = "quant_pipeline.isolation:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quant_pipeline = ["research_console.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.coverage.run]
branch = true
source = ["quant_pipeline"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false

[tool.quant-workspace]
layer = "orchestration"
schemas = [
    { id = "puresaber.pipeline", version = "2.0.0" },
]
lock-files = ["requirements.lock"]
