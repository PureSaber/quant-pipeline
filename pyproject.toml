[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-pipeline"
version = "0.4.0"
description = "Typed, deterministic local DAG orchestration for the PureSaber quant stack"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "quant-lab @ git+https://github.com/PureSaber/quant-lab.git@6ad789442a5ff7b5e3f68d241ecf0ee327f7e82f",
    "quant-factors @ git+https://github.com/PureSaber/quant-factors.git@482e184b4b9b66b47c7528b6cc01cf3077ce78d3",
    "quant-workspace @ git+https://github.com/PureSaber/quant-workspace.git@v0.3.1",
]

[project.optional-dependencies]
workspace = []
research = [
    "quant-agent @ git+https://github.com/PureSaber/quant-agent.git@7c6138d5e9134961abc158fb07e6e872edc49e95",
    "a-share-multifactor @ git+https://github.com/PureSaber/a-share-multifactor.git@90eb322d5a99bf226e7c318e7a741a3bd302fbda",
    "quant-report-hub @ git+https://github.com/PureSaber/quant-report-hub.git@314174c86e5680e9a4129af3e1a1b8cc1ae581d3",
]
dev = [
    "pytest>=9.0,<10",
    "pytest-cov>=7.0,<8",
    "ruff>=0.16,<0.17",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
quant-pipe = "quant_pipeline.cli:main"
quant-research = "quant_pipeline.research_workbench:main"
quant-research-web = "quant_pipeline.research_web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quant_pipeline = ["research_console.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.coverage.run]
branch = true
source = ["quant_pipeline"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false

[tool.quant-workspace]
layer = "orchestration"
schemas = [
    { id = "puresaber.pipeline", version = "2.0.0" },
]
lock-files = ["requirements.lock"]
