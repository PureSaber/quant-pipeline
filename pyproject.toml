[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-pipeline"
version = "0.4.0"
description = "Typed, deterministic local DAG orchestration for the PureSaber quant stack"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "quant-lab @ git+https://github.com/PureSaber/quant-lab.git@bace19c01cf3ecd77fbbb4a5bc75f2ce3498902f",
    "quant-factors @ git+https://github.com/PureSaber/quant-factors.git@ba021bbe11696f0bd5cda0ee047515793f11855d",
    "quant-workspace @ git+https://github.com/PureSaber/quant-workspace.git@v0.3.1",
]

[project.optional-dependencies]
workspace = []
research = [
    "a-share-multifactor @ git+https://github.com/PureSaber/a-share-multifactor.git@a909752bc3666da7de092308b37936dfa18ee764",
    "quant-report-hub @ git+https://github.com/PureSaber/quant-report-hub.git@5226ee9a7c7aaecbef43e96467d4fc3455fcc462",
]
dev = [
    "pytest>=9.0,<10",
    "pytest-cov>=7.0,<8",
    "ruff>=0.16,<0.17",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
quant-pipe = "quant_pipeline.cli:main"
quant-research = "quant_pipeline.research_workbench:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.coverage.run]
branch = true
source = ["quant_pipeline"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false

[tool.quant-workspace]
layer = "orchestration"
schemas = [
    { id = "puresaber.pipeline", version = "2.0.0" },
]
lock-files = ["requirements.lock"]
