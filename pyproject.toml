[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-pipeline"
version = "0.4.0"
description = "Typed, deterministic local DAG orchestration for the PureSaber quant stack"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "quant-lab @ git+https://github.com/PureSaber/quant-lab.git@dad8834298ebf008d76d103a1321fb92bef5470c",
    "quant-factors @ git+https://github.com/PureSaber/quant-factors.git@249fb621d4d880942cb5dfbbcd812c0d45bf45a2",
    "quant-workspace @ git+https://github.com/PureSaber/quant-workspace.git@v0.3.1",
]

[project.optional-dependencies]
workspace = []
research = [
    "arch>=7.2,<9",
    "quant-agent @ git+https://github.com/PureSaber/quant-agent.git@7d710f632e45f7246f6ffe70bed0a44895284233",
    "a-share-multifactor @ git+https://github.com/PureSaber/a-share-multifactor.git@9d6ff223a7db597ebaca9c6689ad8fa60f2a419e",
    "quant-report-hub @ git+https://github.com/PureSaber/quant-report-hub.git@476d60e1fee2f13329886e875caad7b3b04e8b34",
]
dev = [
    "arch>=7.2,<9",
    "setuptools>=68",
    "wheel>=0.46",
    "pytest>=9.0,<10",
    "pytest-cov>=7.0,<8",
    "ruff>=0.16,<0.17",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
quant-pipe = "quant_pipeline.cli:main"
quant-research = "quant_pipeline.research_workbench:main"
quant-research-web = "quant_pipeline.research_web:main"
quant-family-evidence = "quant_pipeline.family_evidence:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quant_pipeline = ["research_console.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.coverage.run]
branch = true
source = ["quant_pipeline"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false

[tool.quant-workspace]
layer = "orchestration"
schemas = [
    { id = "puresaber.pipeline", version = "2.0.0" },
]
lock-files = ["requirements.lock"]
