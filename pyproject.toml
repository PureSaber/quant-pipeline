[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-pipeline"
version = "0.3.0"
description = "Typed, deterministic local DAG orchestration for the PureSaber quant stack"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
workspace = [
    "quant-workspace @ git+https://github.com/PureSaber/quant-workspace.git@0deb1a30afc8b77c4d8d4b92bb86e44b6acbfefb",
]
dev = ["pytest>=9.0,<10", "pytest-cov>=7.0,<8", "ruff>=0.16,<0.17"]

[project.scripts]
quant-pipe = "quant_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.coverage.run]
branch = true
source = ["quant_pipeline"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
