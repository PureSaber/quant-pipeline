name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --no-deps -r requirements.lock
          pip check
          pip install -e . --no-deps --no-build-isolation
          pip check

      - name: Ruff check
        run: ruff check src tests

      - name: Ruff format
        run: ruff format --check src tests

      - name: Full branch coverage
        run: >-
          pytest -q --cov=quant_pipeline --cov-branch
          --cov-report=term-missing --cov-report=json:coverage-full.json --cov-fail-under=80

      - name: V2 core branch coverage
        run: >-
          pytest -q tests/test_v2_schema.py tests/test_dag_runner.py tests/test_integrity_checkpoint.py
          --cov=quant_pipeline.dag_schema
          --cov=quant_pipeline.dag_runner
          --cov=quant_pipeline.checkpoint
          --cov=quant_pipeline.integrity
          --cov-branch --cov-report=term-missing --cov-report=json:coverage-core.json

      - name: V2 core pure branch gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("coverage-core.json").read_text(encoding="utf-8"))
          files = {
              "dag_runner.py": "src/quant_pipeline/dag_runner.py",
              "dag_schema.py": "src/quant_pipeline/dag_schema.py",
              "checkpoint.py": "src/quant_pipeline/checkpoint.py",
              "integrity.py": "src/quant_pipeline/integrity.py",
          }
          failures = []
          for label, expected in files.items():
              normalized = expected.replace("\\", "/")
              entry = next(
                  (value for key, value in report["files"].items()
                   if key.replace("\\", "/") == normalized),
                  None,
              )
              if entry is None:
                  failures.append(f"{label}: missing from coverage JSON")
                  continue
              summary = entry["summary"]
              covered = summary["covered_branches"]
              total = summary["num_branches"]
              if total == 0:
                  failures.append(f"{label}: no branches measured")
                  continue
              ratio = covered / total
              print(f"{label}: {covered}/{total}={ratio:.2%}")
              if ratio < 0.90:
                  failures.append(f"{label}: pure branch gate failed")
          if failures:
              raise SystemExit("; ".join(failures))
          PY
